server {
    listen 80;
    server_name _;
    client_max_body_size 50M;
    client_body_temp_path /tmp/nginx-upload;

    # Web app root
    root /app/sonix-web;
    index index.html;

    # API -> Laravel PHP-FPM
    location /api/ {
        root /app/laravel-backend/public;
        try_files $uri /index.php?$query_string;
    }

    # Laravel storage files
    location /storage/ {
        alias /app/laravel-backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PHP-FPM for Laravel
    location ~ \.php$ {
        root /app/laravel-backend/public;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_buffering off;
    }

    # SPA fallback for web app
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location ~ /\.ht { deny all; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
