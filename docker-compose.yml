services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: sonix
      POSTGRES_USER: sonix
      POSTGRES_PASSWORD: sonix_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: laravel-backend/Dockerfile
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sonix
      DB_USERNAME: sonix
      DB_PASSWORD: sonix_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      # Reverb + Mail + Cloudinary values should be supplied in a real .env

  reverb:
    image: php:8.3-cli
    restart: always
    depends_on:
      - api
    working_dir: /app/laravel-backend
    volumes:
      - ./laravel-backend:/app/laravel-backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
